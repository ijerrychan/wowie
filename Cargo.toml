[package]
name = "wowie"
version = "0.1.0"
edition = "2021"
description = "A small, extensible desktop launcher"
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
png = "0.17"
image = { version = "0.25.10", default-features = false, features = ["ico", "jpeg", "png"] }
steam-vdf-parser = "0.1.1"
slint = { version = "~1.18.0", default-features = false, features = ["std", "compat-1-18", "backend-winit", "unstable-winit-030", "renderer-skia-opengl", "renderer-software", "raw-window-handle-06"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["ApplicationModel_Core", "Management_Deployment", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[build-dependencies]
slint-build = "~1.18.0"
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
