[package]
name = "wowie"
version = "0.1.0"
edition = "2021"
description = "A small, extensible desktop launcher"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3.6.1"
dirs = "6"
fontdb = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25.10", default-features = false, features = ["ico", "jpeg", "png"] }
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
nucleo-matcher = "0.3.1"
rayon = "1.12"
linkify = "0.11"
fasteval = "0.2.4"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
slint = { version = "~1.18.0", default-features = false, features = ["std", "compat-1-18", "backend-winit", "unstable-winit-030", "renderer-femtovg", "renderer-femtovg-wgpu", "renderer-skia", "renderer-skia-opengl", "renderer-software", "raw-window-handle-06"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
everything-ipc = "0.1.4"
windows-future = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["ApplicationModel", "ApplicationModel_Core", "Foundation", "Management_Deployment", "Storage_Search", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }

[build-dependencies]
slint-build = "~1.18.0"
winresource = "0.1"

# Keep application backtraces useful without dependency type/variable symbols.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
