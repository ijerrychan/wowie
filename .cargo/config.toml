[build]
# Avoid growing incremental caches during check/build/test. Dependencies remain cached.
# CARGO_INCREMENTAL=1 can be used temporarily when faster rebuilds matter more.
incremental = false

# Slint's Windows guide recommends an 8 MiB stack for MSVC debug builds.
# This avoids STATUS_STACK_OVERFLOW when renderer/UI code needs more stack
# than the Windows default main-thread allocation.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8000000"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8000000"]
